<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAYATTA KAL | Stay Alive Official</title>
    <link rel="icon" type="image/x-icon" href="favicon.png">
    <style>
        :root {
            --bg-color: #0d1117;
            --accent-red: #a1a1a1;
            --accent-gold: #d1a302;
            --text-main: #c9d1d9;
            --text-dim: #8b949e;
            --card-bg: #161b22;
            --border-color: #30363d;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            margin: 0;
            line-height: 1.6;
        }

        .lang-switcher {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        .lang-btn {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .hero {
            height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: linear-gradient(rgba(13, 17, 23, 0.7), rgba(13, 17, 23, 1)), url('splash.jpg');
            background-size: cover;
            background-position: center;
            border-bottom: 1px solid var(--border-color);
        }

        .hero-content h1 {
            font-size: 3.5rem;
            letter-spacing: 8px;
            color: #fff;
            text-transform: uppercase;
        }

        .play-btn {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 40px;
            background-color: var(--accent-gold);
            color: black;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
        }

        .section {
            padding: 80px 0;
        }

        .section-header h2 {
            font-size: 2rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-align: center;
            margin-bottom: 50px;
        }

        .how-to-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 40px;
            align-items: start;
        }

        .info-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .info-card h3 {
            margin-top: 0;
            color: var(--accent-red);
            font-size: 1.1rem;
            text-transform: uppercase;
        }

        .side-image {
            width: 100%;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            position: sticky;
            top: 20px;
        }

        /* Changelog Styles */
        .changelog-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .log-item {
            padding: 15px;
            border-left: 3px solid var(--accent-gold);
            background: var(--card-bg);
            border-radius: 0 8px 8px 0;
        }

        .log-date {
            font-size: 0.8rem;
            color: var(--accent-gold);
            font-weight: bold;
        }

        .log-title {
            font-weight: bold;
            display: block;
            margin: 5px 0;
            color: #fff;
        }

        .log-desc {
            font-size: 0.9rem;
            color: var(--text-dim);
        }

        footer {
            text-align: center;
            padding: 40px;
            color: var(--text-dim);
            font-size: 0.8rem;
            border-top: 1px solid var(--border-color);
        }

        @media (max-width: 768px) {
            .how-to-grid {
                grid-template-columns: 1fr;
            }

            .hero-content h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>

    <div class="lang-switcher">
        <button class="lang-btn" onclick="toggleLanguage()" id="langBtn">EN</button>
    </div>

    <section class="hero">
        <div class="hero-content">
            <h1 id="title">HAYATTA KAL</h1>
            <a href="https://hayatta-kal-app.vercel.app/" class="play-btn" id="playBtn">HEMEN OYNA</a>
        </div>
    </section>

    <div class="container">
        <section class="section">
            <div class="section-header">
                <h2 id="howToTitle">NASIL OYNANIR</h2>
            </div>
            <div class="how-to-grid">
                <div class="how-to-content" id="infoCards"></div>
                <div class="how-to-media"><img src="well_done2.jpg" alt="Game View" class="side-image"></div>
            </div>
        </section>

        <section class="section">
            <div class="section-header">
                <h2 id="logTitle">YAPILANLAR</h2>
            </div>
            <div class="changelog-list" id="changelogContent">
            </div>
        </section>
    </div>

    <footer id="footerText"></footer>

    <script>
        const translations = {
            tr: {
                langBtn: "EN", title: "HAYATTA KAL", playBtn: "HEMEN OYNA", howToTitle: "NASIL OYNANIR", logTitle: "GELİŞTİRME GÜNLÜĞÜ",
                footer: "&copy; 2026 imyilmaz | Hayatta Kal Project",
                cards: [
                    { h: "HAYATTA KALMA", p: "Canın (HP) veya Meşalen (Enerji) sıfıra düşerse kalıcı olarak ölürsün. Enerji her adımda sürekli azalır." },
                    { h: "ENVANTER", p: "Özel yollar ve takaslar için spesifik eşyaları bulmak şarttır." },
                    { h: "İHTİMAL", p: "Renkler riski temsil eder: Yeşil (Güvenli/Uzun), Turuncu (Orta), Kırmızı (Tehlikeli/Kısa)." },
                    { h: "YETENEKLER", p: "Kazandığın puanlarla yeteneklerini geliştirerek hayatta kalma şansını artır." },
                    { h: "ZAMAN AŞIMI", p: "Hızlı düşün. Karar vermediğin her an enerjin tükenir." }
                ],
                logs: [
                    { d: "2026-04-12", t: "Dil Desteği", r: "Oyun atmosferini dünyaya açmak için tam İngilizce yerelleştirme yapıldı." },
                    { d: "2026-04-12", t: "AI Senaryo Motoru", r: "Gemini API entegrasyonu ile her gün otomatik ve eşsiz senaryolar üretilmesi sağlandı." },
                    { d: "2026-04-12", t: "Mimari Dönüşüm", r: "Daha hızlı ve sürdürülebilir bir yapı için 'Thin-Client' mimarisine geçildi." },
                    { d: "2026-04-12", t: "Yetenek Sistemi", r: "Yetenek ağacı ve puanlama mekanikleri tamamen yenilendi." },
                    { d: "2026-04-12", t: "Ses ve Atmosfer", r: "Kalıcı ses ayarları ve dinamik ses motoru iyileştirmeleri eklendi." },
                    { d: "2026-04-12", t: "Ekonomi ve Market", r: "Premium seçimler ve RevenueCat ile uygulama içi satın alım altyapısı kuruldu." },
                    { d: "2026-04-11", t: "Görsel Optimizasyon", r: "Performansı artırmak için tüm varlıklar JPEG formatına taşındı ve merkezi haritalama yapıldı." },
                    { d: "2026-04-09", t: "Mobil Uyumluluk", r: "Responsive UI ve Safe Area destekleri ile mobil cihazlarda kusursuz görünüm sağlandı." },
                    { d: "2026-04-01", t: "Dinamik Ses Motoru", r: "Kalp atışı ve çevresel sesler için Web Audio API tabanlı prosedürel motor eklendi." }
                ]
            },
            en: {
                langBtn: "TR", title: "STAY ALIVE", playBtn: "PLAY NOW", howToTitle: "HOW TO PLAY", logTitle: "DEVELOPMENT LOG",
                footer: "&copy; 2026 imyilmaz | Stay Alive Project",
                cards: [
                    { h: "SURVIVAL", p: "If Health or Energy hits zero, you die permanently. Energy drains with every step." },
                    { h: "INVENTORY", p: "Specific items are required for special paths and trades." },
                    { h: "PROBABILITY", p: "Colors represent risk: Green (Safe/Long), Orange (Mid), Red (Deadly/Short)." },
                    { h: "ABILITIES", p: "Upgrade your skills with earned points to increase survival chances." },
                    { h: "TIMEOUT", p: "Think fast. Every idle second consumes your energy." }
                ],
                logs: [
                    { d: "2026-04-12", t: "Localization", r: "Full English localization implemented to bring the atmosphere to global players." },
                    { d: "2026-04-12", t: "AI Scenario Engine", r: "Automated daily unique scenario generation via Gemini API integration." },
                    { d: "2026-04-12", t: "Architecture Shift", r: "Transitioned to 'Thin-Client' architecture for a faster and scalable experience." },
                    { d: "2026-04-12", t: "Skill Overhaul", r: "Completely redesigned the skill tree and progression mechanics." },
                    { d: "2026-04-12", t: "Audio & Ambience", r: "Added persistent volume settings and dynamic audio engine improvements." },
                    { d: "2026-04-12", t: "In-App Purchases", r: "Implemented RevenueCat for premium choices and store functionality." },
                    { d: "2026-04-11", t: "Asset Optimization", r: "Migrated all assets to JPEG and centralized mapping for better performance." },
                    { d: "2026-04-09", t: "Mobile Compatibility", r: "Implemented responsive UI and Safe Area context for mobile devices." },
                    { d: "2026-04-01", t: "Dynamic Audio", r: "Added procedural engine based on Web Audio API for heartbeat and ambient effects." }
                ]
            }
        };

        let currentLang = 'tr';
        function updateContent() {
            const data = translations[currentLang];
            document.getElementById('langBtn').innerText = data.langBtn;
            document.getElementById('title').innerText = data.title;
            document.getElementById('playBtn').innerText = data.playBtn;
            document.getElementById('howToTitle').innerText = data.howToTitle;
            document.getElementById('logTitle').innerText = data.logTitle;
            document.getElementById('footerText').innerHTML = data.footer;

            // Update Cards
            const cardContainer = document.getElementById('infoCards');
            cardContainer.innerHTML = data.cards.map(c => `<div class="info-card"><h3>${c.h}</h3><p>${c.p}</p></div>`).join('');

            // Update Logs
            const logContainer = document.getElementById('changelogContent');
            logContainer.innerHTML = data.logs.map(l => `
                <div class="log-item">
                    <span class="log-date">${l.d}</span>
                    <span class="log-title">${l.t}</span>
                    <span class="log-desc">${l.r}</span>
                </div>
            `).join('');
            document.documentElement.lang = currentLang;
        }

        function toggleLanguage() { currentLang = currentLang === 'tr' ? 'en' : 'tr'; updateContent(); }
        updateContent();
    </script>
</body>

</html>
